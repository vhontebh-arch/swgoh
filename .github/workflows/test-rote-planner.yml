name: Test ROTE planner

on:
  push:
    paths:
      - "rote_planner/**"
      - ".github/workflows/test-rote-planner.yml"
  pull_request:
    paths:
      - "rote_planner/**"
      - ".github/workflows/test-rote-planner.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Operations planner tests
        run: python -m unittest discover -s rote_planner/tests -v
