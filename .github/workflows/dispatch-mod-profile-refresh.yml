name: Dispatch single SWGOH mod profile refresh

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: swgoh-optimizer-v2-data
  cancel-in-progress: false

jobs:
  refresh-one-profile:
    if: >-
      github.event.issue.user.login == 'vhontebh-arch' &&
      startsWith(github.event.issue.title, '[refresh-mod-profile] ')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate requested baseId
        id: request
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ "$TITLE" =~ ^\\[refresh-mod-profile\\]\\ ([A-Z0-9_]+)$ ]]; then
            echo "base_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid request title. Expected: [refresh-mod-profile] BASE_ID"
            exit 1
          fi

      - name: Checkout optimizer-v2
        uses: actions/checkout@v4
        with:
          ref: optimizer-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh requested profile only
        id: refresh
        env:
          BASE_ID: ${{ steps.request.outputs.base_id }}
        run: |
          set -euo pipefail
          cp mod_profiles.json mod_profiles.previous.json
          python update_mod_profiles.py --units "$BASE_ID" --max-age-days 0
          test -s mod_profiles.json
          python -m json.tool mod_profiles.json >/dev/null
          python - "$BASE_ID" <<'PY'
          import json
          import sys

          base_id = sys.argv[1]
          with open("mod_profiles.json", encoding="utf-8") as f:
              data = json.load(f)

          profile = data.get("profiles", {}).get(base_id)
          if not profile:
              raise SystemExit(f"ERROR: brak profilu {base_id} po odświeżeniu")
          if not profile.get("primary_preferences"):
              raise SystemExit(f"ERROR: {base_id}: brak primary_preferences")
          if not profile.get("secondary_preferences"):
              raise SystemExit(f"ERROR: {base_id}: brak secondary_preferences")
          print(f"OK: profil {base_id} został zweryfikowany")
          PY

      - name: Commit refreshed profile data
        id: commit
        env:
          BASE_ID: ${{ steps.request.outputs.base_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod_profiles.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Profil jest aktualny; brak zmian do zapisania."
          else
            git commit -m "Refresh mod profile: $BASE_ID"
            git push origin HEAD:optimizer-v2
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report result on request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_ID: ${{ steps.request.outputs.base_id }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$REFRESH_OUTCOME" == "success" && "$COMMIT_OUTCOME" == "success" ]]; then
            if [[ "$CHANGED" == "true" ]]; then
              MESSAGE="✅ Profil `$BASE_ID` został odświeżony, zweryfikowany i zapisany na gałęzi `optimizer-v2`. [Logi workflow]($RUN_URL)"
            else
              MESSAGE="✅ Profil `$BASE_ID` został pobrany i zweryfikowany; nie było zmian do zapisania. [Logi workflow]($RUN_URL)"
            fi
          else
            MESSAGE="❌ Odświeżanie profilu `$BASE_ID` nie zakończyło się poprawnie. Sprawdź [logi workflow]($RUN_URL), aby zobaczyć przyczynę."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
