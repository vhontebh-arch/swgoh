name: Refresh character importance ranking

on:
  push:
    branches:
      - feature/character-importance-ranking
    paths:
      - "character_ranking.py"
      - "update_character_ranking.py"
      - "tests/test_character_ranking.py"
      - ".github/workflows/refresh-character-ranking.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: character-importance-ranking
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ranking branch
        uses: actions/checkout@v4
        with:
          ref: feature/character-importance-ranking
          fetch-depth: 0

      - name: Fetch canonical game data
        run: |
          git fetch origin optimizer-data
          git checkout FETCH_HEAD -- data.json localization.json
          test -s data.json
          test -s localization.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_character_ranking.py" -v

      - name: Fetch relic counts and release dates; build ranking
        run: python update_character_ranking.py

      - name: Validate generated ranking
        run: |
          python - <<'PY'
          import csv, json
          with open("character_counts.csv", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          with open("character_ranking.json", encoding="utf-8") as f:
              ranking = json.load(f)
          assert len(rows) >= 150, len(rows)
          assert len(ranking["characters"]) == len(rows)
          assert len({r["baseId"] for r in rows}) == len(rows)
          assert all(r["global_relic_r5_plus_players"] >= r["global_relic_r7_plus_players"] >= r["global_relic_r9_plus_players"] for r in rows)
          assert all(r["rank"] == i for i, r in enumerate(ranking["characters"], 1))
          print("Validated", len(rows), "characters")
          PY

      - name: Publish generated ranking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character_counts.csv character_release_dates.json character_ranking.json
          if git diff --cached --quiet; then
            echo "Ranking data unchanged."
          else
            git commit -m "Refresh character importance ranking data"
            git push origin HEAD:feature/character-importance-ranking
          fi
