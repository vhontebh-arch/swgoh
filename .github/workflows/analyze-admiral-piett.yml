name: Analyze Admiral Piett mods

on:
  push:
    branches:
      - optimizer-v2
    paths:
      - ".github/workflows/analyze-admiral-piett.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    name: Refresh and verify canonical snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request one fresh canonical SWGOH snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/update-swgoh.yml/dispatches" \
            -f ref=main \
            -f inputs[skip_optimizer_v2]=true
          run_id=""
          for attempt in $(seq 1 120); do
            run_id="$(gh run list \
              --workflow update-swgoh.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,status \
              --jq '.[] | select(.createdAt >= "'"$requested_at"'" and .status != "completed") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            echo "Oczekiwanie na utworzenie aktualizacji danych ($attempt/120)..."
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "ERROR: Nie odnaleziono aktywnego uruchomienia producenta snapshotu."
            exit 1
          fi
          echo "Czekam na producenta snapshotu: $run_id"
          gh run watch "$run_id" --exit-status --interval 10
      - name: Sync and verify the newly published snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          python sync_optimizer_data.py
          python -m json.tool swgoh_972824625.json >/dev/null
          python -m json.tool c3po.json >/dev/null
          python -m json.tool data.json >/dev/null
          python -m json.tool localization.json >/dev/null
          python -m json.tool mod_profiles.json >/dev/null
      - name: Preflight target profile
        run: python optimizer_preflight.py --target ADMIRALPIETT
      - name: Preserve exact verified snapshot for matrix jobs
        uses: actions/upload-artifact@v4
        with:
          name: piett-canonical-snapshot
          path: |
            data_manifest.json
            swgoh_972824625.json
            c3po.json
            data.json
            localization.json
            roster.csv
            ships.csv
            mods.csv
            mod_profiles.json
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Analyze chain cap ${{ matrix.alternative_cap }}
    needs: refresh
    strategy:
      fail-fast: false
      matrix:
        alternative_cap: [1, 2, 3, 5, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact verified canonical snapshot
        uses: actions/download-artifact@v4
        with:
          name: piett-canonical-snapshot
          path: .
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Compile optimizer
        run: python -m py_compile mod_analyzer.py character_ranking.py
      - name: Run Admiral Piett analysis
        run: |
          set -e
          python mod_analyzer.py --target "ADMIRALPIETT" --chain-alternative-cap "${{ matrix.alternative_cap }}"
          test -s mod_analysis.csv
          test -s mod_analysis.md
      - name: Upload analysis output
        uses: actions/upload-artifact@v4
        with:
          name: admiral-piett-analysis-cap-${{ matrix.alternative_cap }}
          path: |
            mod_analysis.csv
            mod_analysis.md
          if-no-files-found: error

# Dedicated analysis reads only a single hash-verified optimizer-data snapshot.
