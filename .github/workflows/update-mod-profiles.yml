name: Refresh canonical SWGOH mod profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 */5 * *"

concurrency:
  group: swgoh-canonical-data-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load canonical profile cache
        run: |
          set -e
          python sync_optimizer_data.py --files mod_profiles.json
          python -m json.tool mod_profiles.json >/dev/null

      - name: Refresh all cached profiles from configured SWGOH.GG sources
        run: |
          set -e
          python update_mod_profiles.py
          python -m json.tool mod_profiles.json >/dev/null
          python - <<'PY'
          import json
          with open("mod_profiles.json", encoding="utf-8") as stream:
              profiles = json.load(stream).get("profiles", {})
          if not profiles:
              raise SystemExit("ERROR: brak profili po aktualizacji")
          for base_id, profile in profiles.items():
              for key in ("set_combinations", "primary_preferences", "secondary_preferences"):
                  if not profile.get(key):
                      raise SystemExit(f"ERROR: {base_id}: brak {key}")
              sources = profile.get("source_model", {}).get("sources", [])
              if len(sources) < 2:
                  raise SystemExit(f"ERROR: {base_id}: wymagane są dwa źródła SWGOH.GG")
          print(f"OK: zweryfikowano {len(profiles)} profili")
          PY

      - name: Publish shared profile cache
        run: |
          set -e
          python publish_optimizer_data.py --profiles-only
