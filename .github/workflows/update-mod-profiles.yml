name: Refresh shared mod profiles (forward to main)

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical profile refresh on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/update-mod-profiles.yml/dispatches" -f ref=main
          echo "Wysłano żądanie odświeżenia wspólnego cache profili na main."
