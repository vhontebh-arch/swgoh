name: Rank-weighted optimizer live regression

on:
  push:
    branches:
      - experiment/rank-weighted-chain-selection
      - analysis/gopherants-health-triangle
    paths:
      - ".github/workflows/run-rank-weighted-mod-analysis.yml"
      - "mod_analyzer.py"
      - "character_ranking.py"
      - "character_ranking.json"
      - "mod_profiles.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Target BASE_ID"
        required: true
        default: "GOPHERANTS"
        type: string

permissions:
  contents: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        alternative_cap: [5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Compile optimizer
        run: python -m py_compile mod_analyzer.py character_ranking.py
      - name: Run target analysis with Rank-weighted chain selection
        run: |
          set -e
          python mod_analyzer.py --target "${{ inputs.target || 'GOPHERANTS' }}" --chain-alternative-cap "${{ matrix.alternative_cap }}"
          test -s mod_analysis.csv
          test -s mod_analysis.md
      - name: Upload analysis output
        uses: actions/upload-artifact@v4
        with:
          name: rank-weighted-mod-analysis-cap-${{ matrix.alternative_cap }}
          path: |
            mod_analysis.csv
            mod_analysis.md

      - name: Commit generated analysis report to this analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod_analysis.csv mod_analysis.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Add Grogu Health Triangle analysis report"
          git push
