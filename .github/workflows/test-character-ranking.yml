name: Character ranking tests

on:
  push:
    branches:
      - feature/character-importance-ranking
    paths:
      - "character_ranking.py"
      - "tests/test_character_ranking.py"
      - ".github/workflows/test-character-ranking.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_character_ranking.py" -v
