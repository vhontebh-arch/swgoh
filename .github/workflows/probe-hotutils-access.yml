name: Build HotUtils Players coverage snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hotutils-access.yml"
    branches:
      - "feature/character-importance-ranking"
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Players data for every character
        run: |
          python - <<'PY'
          import csv, json, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          BASE="https://players.hotutils.com/api"
          V="mwiyyicv"
          HEADERS={"User-Agent":"Mozilla/5.0 Chrome/131.0.0.0 Safari/537.36",
                   "Accept":"application/json, text/plain, */*",
                   "Referer":"https://players.hotutils.com/units"}
          def get(path):
              url=BASE+path+"?v="+V
              for attempt in range(4):
                  req=urllib.request.Request(url,headers=HEADERS)
                  try:
                      with urllib.request.urlopen(req,timeout=40) as r:
                          raw=r.read()
                          return r.status,json.loads(raw),len(raw),None
                  except urllib.error.HTTPError as e:
                      body=e.read(2000).decode("utf-8","replace")
                      if e.code==429 or e.code>=500:
                          time.sleep(int(e.headers.get("Retry-After","3")) if e.code==429 else 2**attempt)
                          continue
                      return e.code,None,0,body
                  except Exception as e:
                      if attempt<3:
                          time.sleep(2**attempt); continue
                      return None,None,0,repr(e)
              return None,None,0,"retry limit"
          status,cat,size,error=get("/units")
          if status!=200 or not isinstance(cat,dict):
              raise SystemExit(f"Catalogue failed: HTTP {status}: {error}")
          units=cat.get("units",[])
          chars=[u for u in units if u.get("combatType")==1]
          ships=[u for u in units if u.get("combatType")==2]
          rows=[]
          payload={}
          for n,u in enumerate(chars,1):
              uid=u["baseId"]
              st,d,sz,err=get("/units/"+uid+"/players")
              row={"baseId":uid,"name":u.get("name"),"released":u.get("released"),
                   "http":st,"bytes":sz,"available":None,"segment":None,"owners":None,
                   "segmentPlayers":None,"computedAt":None,
                   "levels_sum":None,"rarity_sum":None,"gear_sum":None,"relic_sum":None,
                   "levels_delta":None,"rarity_delta":None,"gear_delta":None,"relic_delta":None,
                   "levelsUnknown":None,"error":err}
              if isinstance(d,dict):
                  row.update({"available":d.get("available"),"segment":d.get("segment"),
                              "owners":d.get("owners"),"segmentPlayers":d.get("segmentPlayers"),
                              "computedAt":d.get("computedAt"),"levelsUnknown":d.get("levelsUnknown")})
                  for key in ["levels","rarity","gear","relic"]:
                      total=sum(int(x.get("count",0)) for x in d.get(key,[]) if isinstance(x,dict))
                      row[key+"_sum"]=total
                      row[key+"_delta"]=total-(d.get("owners") or 0)
                  payload[uid]=d
              rows.append(row)
              if n%25==0: print(f"Fetched {n}/{len(chars)} characters")
              time.sleep(0.35)
          available=[r for r in rows if r["http"]==200 and r["available"] is True]
          missing=[r for r in rows if not (r["http"]==200 and r["available"] is True)]
          mismatches={k:[r for r in available if r[k+"_delta"]!=0] for k in ["levels","rarity","gear","relic"]}
          computed=sorted(set(r["computedAt"] for r in available if r["computedAt"]))
          segments=sorted(set(r["segment"] for r in available if r["segment"]))
          summary={
            "generatedAt":datetime.now(timezone.utc).isoformat(),
            "catalogueVersion":cat.get("version"),"catalogueAsOf":cat.get("asOf"),
            "catalogueUnits":len(units),"characters":len(chars),"shipsExcluded":len(ships),
            "available":len(available),"unavailableOrErrors":len(missing),
            "segments":segments,"computedAtValues":computed,
            "mismatchCounts":{k:len(v) for k,v in mismatches.items()},
            "examples":{k:v[:15] for k,v in mismatches.items()},
            "missing":missing
          }
          with open("hotutils-players-summary.json","w") as f: json.dump(summary,f,indent=2)
          with open("hotutils-players-all.json","w") as f: json.dump({"summary":summary,"units":payload},f,separators=(",",":"))
          with open("hotutils-players-index.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotutils-players-full-character-snapshot
          path: |
            hotutils-players-summary.json
            hotutils-players-index.csv
            hotutils-players-all.json
          retention-days: 14
