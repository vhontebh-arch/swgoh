name: Probe HotUtils character data
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hotutils-access.yml"
    branches:
      - "feature/character-importance-ranking"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test HotUtils Players API
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          base="https://players.hotutils.com"
          version="mwiyyicv"
          endpoints=[
            "/api/units/ADMIRALACKBAR/players?v="+version,
            "/api/units/ADMIRALACKBAR/stats?v="+version,
            "/api/units/ADMIRALACKBAR/top/players?v="+version,
          ]
          out=[]
          for path in endpoints:
            url=base+path
            req=urllib.request.Request(url,headers={
              "User-Agent":"Mozilla/5.0 Chrome/131.0.0.0 Safari/537.36",
              "Accept":"application/json, text/plain, */*",
              "Referer":base+"/units/ADMIRALACKBAR",
              "Origin":base,
            })
            item={"url":url}
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                body=r.read()
                item.update({"status":r.status,"content_type":r.headers.get("Content-Type"),
                             "bytes":len(body),"sample":body[:6000].decode("utf-8","replace")})
                try:
                  data=json.loads(body)
                  item["json_type"]=type(data).__name__
                  if isinstance(data,dict): item["json_keys"]=list(data.keys())
                  if isinstance(data,list): item["list_length"]=len(data)
                except Exception: pass
            except urllib.error.HTTPError as e:
              item.update({"status":e.code,"error_body":e.read(3000).decode("utf-8","replace")})
            except Exception as e: item["error"]=repr(e)
            out.append(item)
          open("hotutils-api-probe.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotutils-api-probe
          path: hotutils-api-probe.json
          retention-days: 7
