name: Probe HotUtils character data
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hotutils-access.yml"
    branches:
      - "feature/character-importance-ranking"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Admiral Ackbar profile
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser
          url = "https://players.hotutils.com/units/ADMIRALACKBAR"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          })
          result = {"requested_url": url}
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  body = response.read()
                  html = body.decode("utf-8", "replace")
                  result.update({
                      "status": response.status,
                      "final_url": response.geturl(),
                      "content_type": response.headers.get("Content-Type"),
                      "bytes": len(body),
                      "has_players_text": bool(re.search(r"players", html, re.I)),
                      "has_ackbar_text": bool(re.search(r"admiral ackbar", html, re.I)),
                      "has_challenge_marker": any(x in html.lower() for x in ["cloudflare", "just a moment", "checking your browser"]),
                      "title": (re.search(r"<title[^>]*>(.*?)</title>", html, re.I|re.S).group(1).strip() if re.search(r"<title[^>]*>(.*?)</title>", html, re.I|re.S) else None),
                      "script_sources": re.findall(r'<script[^>]+src=["\\']([^"\\']+)', html, re.I),
                      "api_like_strings": sorted(set(re.findall(r'["\\']([^"\\']*(?:/api/|graphql|players?)[^"\\']*)["\\']', html, re.I)))[:100],
                      "html_excerpt": html[:12000],
                  })
          except Exception as e:
              result["error"] = repr(e)
          with open("hotutils-probe.json", "w") as f:
              json.dump(result, f, indent=2)
          print(json.dumps({k:v for k,v in result.items() if k != "html_excerpt"}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotutils-probe
          path: hotutils-probe.json
          retention-days: 7
