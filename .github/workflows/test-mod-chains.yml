name: Mod optimizer preflight and regression tests

on:
  push:
    branches:
      - optimizer-v2
    paths:
      - "optimizer_preflight.py"
      - "test_optimizer_preflight.py"
      - "mod_analyzer.py"
      - "test_mod_chains.py"
      - "test_target_selection.py"
      - "update_mod_profiles.py"
      - "test_mod_profile_cache.py"
      - "mod_profiles.json"
      - "OPTIMIZER_WORK_PROTOCOL.md"
      - "MOD_OPTIMIZATION_RULES.md"
      - "MOD_PROFILE_REFRESH.md"
      - "GRANDIVORY_METHOD_REVIEW.md"
      - ".github/workflows/test-mod-chains.yml"
  pull_request:
    branches:
      - optimizer-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Vel Sartha preflight
        run: >-
          python optimizer_preflight.py
          --target "Vel Sartha"
          --donor "Merrin"
          --donor 'RC-1262 "Scorch"'
      - name: Run optimizer regression tests
        run: python -m unittest -v test_optimizer_preflight test_mod_chains test_mod_profile_cache test_target_selection
