name: Mod chain regression tests

on:
  push:
    branches:
      - optimizer-v2
    paths:
      - "mod_analyzer.py"
      - "test_mod_chains.py"
      - ".github/workflows/test-mod-chains.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run transfer chain regression tests
        run: python -m unittest -v test_mod_chains
