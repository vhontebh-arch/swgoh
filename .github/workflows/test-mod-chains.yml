name: Mod optimizer preflight and regression tests

on:
  push:
    branches:
      - optimizer-v2
    paths:
      - "optimizer_preflight.py"
      - "test_optimizer_preflight.py"
      - "mod_analyzer.py"
      - "sync_optimizer_data.py"
      - "test_optimizer_data_sync.py"
      - "test_mod_chains.py"
      - "test_scoring_consistency.py"
      - "test_target_selection.py"
      - "validate_mod_target_report.py"
      - "test_target_report_validation.py"
      - "test_user_mod_report.py"
      - "test_profile_merge.py"
      - "update_mod_profiles.py"
      - "test_mod_profile_cache.py"
      - "mod_profiles.json"
      - "OPTIMIZER_WORK_PROTOCOL.md"
      - "MOD_OPTIMIZATION_RULES.md"
      - "MOD_PROFILE_REFRESH.md"
      - "GRANDIVORY_METHOD_REVIEW.md"
      - ".github/workflows/test-mod-chains.yml"
  pull_request:
    branches:
      - optimizer-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Vel Sartha preflight
        if: github.event_name != 'pull_request'
        run: >-
          python optimizer_preflight.py
          --target "Vel Sartha"
          --donor "Merrin"
          --donor 'RC-1262 "Scorch"'
      - name: Run optimizer regression tests
        run: python -m unittest -v test_optimizer_preflight test_mod_chains test_scoring_consistency test_mod_profile_cache test_target_selection test_target_report_validation test_user_mod_report test_profile_merge test_optimizer_data_sync
      - name: Generate Vel account-balance audit from cached profiles
        if: github.event_name == 'pull_request'
        run: |
          python mod_analyzer.py --target VEL
          python validate_mod_target_report.py
      - name: Upload generated account-balance report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vel-account-balance-audit
          path: |
            mod_analysis.md
            mod_analysis.csv
          if-no-files-found: error
