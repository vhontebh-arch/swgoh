name: Probe SWGOH.GG Ability Report access

on:
  push:
    branches:
      - feature/character-importance-ranking
    paths:
      - ".github/workflows/probe-ability-report.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Zeta and Omicron report pages
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from html.parser import HTMLParser

          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = 0
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.rows += 1

          pages = {
              "zeta": "https://swgoh.gg/stats/ability-report/?fm=zeta",
              "omicron": "https://swgoh.gg/stats/ability-report/",
          }
          failures = []
          for label, url in pages.items():
              candidates = [
                  ("direct", url),
                  ("allorigins", "https://api.allorigins.win/raw?url=" + quote(url, safe="")),
              ]
              success = False
              for source, endpoint in candidates:
                  try:
                      req = Request(endpoint, headers={"User-Agent": "Mozilla/5.0"})
                      with urlopen(req, timeout=20) as response:
                          body = response.read().decode("utf-8", "replace")
                      parser = Rows()
                      parser.feed(body)
                      expected = "SWGOH" in body and ("Zeta" if label == "zeta" else "Omicron") in body
                      if len(body) < 5000 or parser.rows < 20 or not expected:
                          raise RuntimeError(f"unexpected response: {len(body)} bytes, {parser.rows} table rows")
                      print(f"PASS {label}: source={source}, bytes={len(body)}, table_rows={parser.rows}")
                      success = True
                      break
                  except Exception as exc:
                      print(f"FAIL {label} via {source}: {type(exc).__name__}: {exc}")
              if not success:
                  failures.append(label)
          if failures:
              raise SystemExit("Unable to retrieve reports: " + ", ".join(failures))
          PY
