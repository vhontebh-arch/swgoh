name: Run optimizer from canonical SWGOH data

on:
  workflow_dispatch:
    inputs:
      mod_analysis_targets:
        description: "Opcjonalne BASE_ID celów, oddzielone przecinkami; puste = mod_analysis_target.json"
        required: false
        type: string
  push:
    branches:
      - optimizer-v2
      - experiment/actual-donor-rebuild-score
    paths:
      - "mod_analyzer.py"
      - "ship_analysis.py"
      - "fleet_analysis.py"
      - "calculate_resources.py"
      - "sync_optimizer_data.py"
      - "mod_analysis_target.json"
      - "targets.json"
      - "protected_owners.json"
      - ".github/workflows/update-swgoh.yml"

concurrency:
  group: swgoh-optimizer-v2-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout optimizer-v2
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync one canonical data snapshot
        run: |
          set -e
          python sync_optimizer_data.py
          python -m json.tool swgoh_972824625.json >/dev/null
          python -m json.tool c3po.json >/dev/null
          python -m json.tool data.json >/dev/null
          python -m json.tool localization.json >/dev/null
          python -m json.tool mod_profiles.json >/dev/null

      - name: Test canonical snapshot verifier
        run: python -m unittest -v test_optimizer_data_sync.py

      - name: Generate mod analysis
        env:
          MOD_ANALYSIS_TARGETS: ${{ inputs.mod_analysis_targets }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          raw = os.environ.get("MOD_ANALYSIS_TARGETS", "").strip()
          if raw:
              targets = [value.strip().upper() for value in raw.split(",") if value.strip()]
          else:
              with open("mod_analysis_target.json", encoding="utf-8") as stream:
                  targets = json.load(stream).get("targets", [])
              targets = [str(value).strip().upper() for value in targets if str(value).strip()]

          if not targets:
              raise SystemExit("Brak celów w mod_analysis_target.json lub parametrze workflow.")

          command = [sys.executable, "mod_analyzer.py"]
          unique_targets = list(dict.fromkeys(targets))
          for target in unique_targets:
              command.extend(["--target", target])
          print("Cele analizy:", ", ".join(unique_targets))
          subprocess.run(command, check=True)
          PY
          test -s mod_analysis.csv
          test -s mod_analysis.md

      - name: Generate ship analysis
        run: |
          set -e
          python ship_analysis.py
          test -s ship_analysis.md

      - name: Generate fleet analysis
        run: |
          set -e
          python fleet_analysis.py
          test -s fleet_analysis.md

      - name: Calculate farming resources
        run: |
          set -e
          python calculate_resources.py
          test -s account_farming_report.md

      - name: Validate reports and canonical inputs
        run: |
          set -e
          for file in roster.csv ships.csv mods.csv mod_profiles.json data.json localization.json c3po.json; do
            test -s "$file"
          done
          for file in mod_analysis.csv mod_analysis.md ship_analysis.md fleet_analysis.md account_farming_report.md; do
            test -s "$file"
          done

      - name: Commit generated reports only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod_analysis.csv mod_analysis.md ship_analysis.md fleet_analysis.md account_farming_report.md
          if git diff --cached --quiet; then
            echo "Brak zmian w raportach."
          else
            git commit -m "Update optimizer reports from canonical data"
            git push
          fi
