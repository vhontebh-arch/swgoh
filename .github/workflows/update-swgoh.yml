name: Update SWGOH data

on:
  schedule:
    # 06:15 UTC = 08:15 czasu polskiego latem
    - cron: "15 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swgoh-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch SWGOH data
        env:
          ALLY_CODE: "972-824-625"
        run: |
          python scripts/update_swgoh.py

      - name: Validate JSON
        run: |
          python -m json.tool swgoh_972824625.json > /dev/null

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- swgoh_972824625.json Vhonte-972824625-characters.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add swgoh_972824625.json Vhonte-972824625-characters.csv

          git commit \
            -m "Update SWGOH data $(date -u +'%Y-%m-%d %H:%M UTC')"

          git push
