name: Update SWGOH data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # PLAYER DATA
      # ================================================================

      - name: Download player data
        run: |
          set -e

          echo "Pobieranie player data..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://swgoh4.life/api/player/972824625" \
            -o swgoh_972824625.json

          echo "Rozmiar pliku:"
          wc -c swgoh_972824625.json

          if [ ! -s swgoh_972824625.json ]; then
            echo "ERROR: swgoh_972824625.json jest pusty."
            exit 1
          fi

          echo "Walidacja JSON..."

          if ! python -m json.tool swgoh_972824625.json > /dev/null; then
            echo "ERROR: player data nie jest poprawnym JSON-em."
            echo ""
            echo "Początek odpowiedzi endpointu:"
            head -c 1000 swgoh_972824625.json || true
            echo ""
            exit 1
          fi

          echo "Player data OK."

      # ================================================================
      # GAME DATA
      # ================================================================

      - name: Download game data
        run: |
          set -e

          echo "Pobieranie game data..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://swgoh4.life/api/data" \
            -o data.json

          echo "Rozmiar pliku:"
          wc -c data.json

          if [ ! -s data.json ]; then
            echo "ERROR: data.json jest pusty."
            exit 1
          fi

          echo "Walidacja JSON..."

          if ! python -m json.tool data.json > /dev/null; then
            echo "ERROR: data.json nie jest poprawnym JSON-em."
            echo ""
            echo "Początek odpowiedzi endpointu:"
            head -c 1000 data.json || true
            echo ""
            exit 1
          fi

          echo "Game data OK."

      # ================================================================
      # LOCALIZATION
      # ================================================================

      - name: Download localization
        run: |
          set -e

          echo "Pobieranie localization..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://swgoh4.life/api/localization" \
            -o localization.json

          echo "Rozmiar pliku:"
          wc -c localization.json

          if [ ! -s localization.json ]; then
            echo "ERROR: localization.json jest pusty."
            exit 1
          fi

          echo "Walidacja JSON..."

          if ! python -m json.tool localization.json > /dev/null; then
            echo "ERROR: localization.json nie jest poprawnym JSON-em."
            echo ""
            echo "Początek odpowiedzi endpointu:"
            head -c 1000 localization.json || true
            echo ""
            exit 1
          fi

          echo "Localization OK."

      # ================================================================
      # ROSTER CSV
      # ================================================================

      - name: Generate roster CSV
        run: |
          python - <<'PY'
          import csv
          import json

          with open(
              "swgoh_972824625.json",
              encoding="utf-8"
          ) as f:
              player = json.load(f)

          with open(
              "data.json",
              encoding="utf-8"
          ) as f:
              game = json.load(f)

          units = {}

          for unit in game.get("units", []):
              base_id = unit.get("baseId")

              if base_id:
                  units[base_id] = unit

          rows = []

          for unit in player.get("rosterUnit", []):

              definition_id = unit.get(
                  "definitionId",
                  ""
              )

              if not definition_id:
                  continue

              base_id = definition_id.split(
                  ":",
                  1
              )[0]

              game_unit = units.get(
                  base_id,
                  {}
              )

              if game_unit.get("combatType") != 1:
                  continue

              rows.append({
                  "name": base_id,
                  "baseId": base_id,
                  "definitionId": definition_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get("relic") or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })

          fields = [
              "name",
              "baseId",
              "definitionId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]

          with open(
              "roster.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(rows)

          print("Wygenerowano roster.csv")
          print("Liczba postaci:", len(rows))
          PY

      # ================================================================
      # SHIPS CSV
      # ================================================================

      - name: Generate ships CSV
        run: |
          cat > generate_ships.py <<'PY'
          import csv
          import json
          import base64
          import zipfile
          import io

          with open(
              "swgoh_972824625.json",
              encoding="utf-8"
          ) as f:
              player = json.load(f)

          with open(
              "data.json",
              encoding="utf-8"
          ) as f:
              game = json.load(f)

          with open(
              "localization.json",
              encoding="utf-8"
          ) as f:
              localization = json.load(f)

          bundle = base64.b64decode(
              localization["localizationBundle"]
          )

          z = zipfile.ZipFile(
              io.BytesIO(bundle)
          )

          lines = z.read(
              "Loc_ENG_US.txt"
          ).decode(
              "utf-8",
              "replace"
          ).splitlines()

          names = {}

          for line in lines:
              if "|" in line:
                  key, value = line.split("|", 1)
                  names[key] = value

          units = {}

          for unit in game.get("units", []):
              base_id = unit.get("baseId")

              if base_id:
                  units[base_id] = unit

          ships = []

          for unit in player.get("rosterUnit", []):

              # ========================================================
              # Ship identity comes from definitionId.
              #
              # Example:
              # SLAVE1:SEVEN_STAR -> SLAVE1
              #
              # This is more reliable than trying to identify ships
              # through basicskill_ entries.
              # ========================================================

              definition_id = unit.get(
                  "definitionId",
                  ""
              )

              if not definition_id:
                  continue

              base_id = definition_id.split(
                  ":",
                  1
              )[0]

              game_unit = units.get(
                  base_id,
                  {}
              )

              if game_unit.get("combatType") != 2:
                  continue

              name_key = game_unit.get(
                  "nameKey",
                  ""
              )

              name = names.get(
                  name_key,
                  names.get(
                      "UNIT_" + base_id + "_NAME",
                      base_id
                  )
              )

              ships.append({
                  "name": name,
                  "definitionId": definition_id,
                  "baseId": base_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get("relic") or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })

          fields = [
              "name",
              "definitionId",
              "baseId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]

          with open(
              "ships.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(ships)

          print("Wygenerowano ships.csv")
          print("Liczba statków:", len(ships))

          print("")
          print("Kontrola kluczowych statków:")
          print("")

          important_ships = [
              "SLAVE1",
              "RAZORCREST",
              "IG2000",
              "HOUNDSTOOTH",
              "TIEADVANCED",
              "TIEBOMBERIMPERIAL",
              "TIEFIGHTERIMPERIAL",
              "OUTRIDER",
              "B28EXTINCTIONCLASSBOMBER",
              "MARKVIINTERCEPTOR",
              "TIEDAGGER",
              "EBONHAWK",
              "SCIMITAR"
          ]

          ships_by_base_id = {
              ship["baseId"]: ship
              for ship in ships
          }

          for base_id in important_ships:

              ship = ships_by_base_id.get(
                  base_id
              )

              if ship:
                  print(
                      "OK   |",
                      base_id,
                      "|",
                      ship["name"],
                      "|",
                      ship["rarity"],
                      "★",
                      "|",
                      ship["definitionId"]
                  )
              else:
                  print(
                      "BRAK |",
                      base_id
                  )

          print("")
          print("Statystyka gwiazdek:")

          star_counts = {}

          for ship in ships:
              rarity = ship["rarity"]

              star_counts[rarity] = (
                  star_counts.get(
                      rarity,
                      0
                  ) + 1
              )

          for rarity in sorted(
              star_counts,
              reverse=True
          ):
              print(
                  rarity,
                  "★:",
                  star_counts[rarity]
              )

          print("")
          PY

          python generate_ships.py

      # ================================================================
      # SHIP ANALYSIS
      # ================================================================

      - name: Generate ship analysis
        run: |
          python ship_analysis.py
          echo "Wygenerowano ship_analysis.md"

      # ================================================================
      # FLEET ANALYSIS
      # ================================================================

      - name: Generate fleet analysis
        run: |
          python fleet_analysis.py
          echo "Wygenerowano fleet_analysis.md"

      # ================================================================
      # FARMING CALCULATOR
      # ================================================================

      - name: Calculate farming resources
        run: |
          python calculate_resources.py

      # ================================================================
      # COMMIT
      # ================================================================

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            roster.csv \
            ships.csv \
            account_farming_report.md \
            ship_analysis.md \
            fleet_analysis.md

          if git diff --cached --quiet; then
            echo "Brak zmian"
          else
            git commit -m "Update SWGOH data"
            git push
          fi
