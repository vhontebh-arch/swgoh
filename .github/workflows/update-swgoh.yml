name: Update SWGOH data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -e

          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            swgoh_comlink==2.3.0 \
            brotli

      # ============================================================
      # START COMLINK
      # ============================================================

      - name: Start SWGOH Comlink
        run: |
          set -e

          echo "Pobieranie SWGOH Comlink..."

          docker pull \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

          echo "Uruchamianie Comlink..."

          docker run \
            --name swgoh-comlink \
            -d \
            -p 3000:3000 \
            -e APP_NAME=vhonte-swgoh-github-actions \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

          echo "Oczekiwanie na Comlink..."

          for i in $(seq 1 30); do

            if curl -fsS \
              "http://127.0.0.1:3000/" \
              >/dev/null 2>&1
            then

              echo "Comlink działa."
              exit 0

            fi

            echo "Próba $i/30..."
            sleep 2

          done

          echo ""
          echo "ERROR: Comlink nie wystartował."
          echo ""

          docker logs swgoh-comlink

          exit 1

      # ============================================================
      # DOWNLOAD PLAYER DATA
      # ============================================================

      - name: Download player data
        run: |
          set -e

          python - <<'PY'
          import json

          from swgoh_comlink import SwgohComlink


          ALLY_CODE = 972824625
          COMLINK_URL = "http://127.0.0.1:3000"


          print("")
          print("=" * 80)
          print("POBIERANIE PLAYER DATA")
          print("=" * 80)
          print("")


          with SwgohComlink(
              url=COMLINK_URL,
              version_cache_ttl=0
          ) as comlink:

              player = comlink.get_player(
                  allycode=ALLY_CODE,
                  enums=False
              )


          if not isinstance(
              player,
              dict
          ):
              raise RuntimeError(
                  "Player data nie jest obiektem JSON."
              )


          roster = player.get(
              "rosterUnit",
              []
          )


          if not roster:
              raise RuntimeError(
                  "Player data nie zawiera rosterUnit."
              )


          with open(
              "swgoh_972824625.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  player,
                  f,
                  ensure_ascii=False
              )


          print(
              "OK: player data"
          )

          print(
              "Liczba rosterUnit:",
              len(roster)
          )

          PY

          test -s swgoh_972824625.json

      # ============================================================
      # DOWNLOAD CURRENT GAME DATA
      # ============================================================

      - name: Download current game data
        run: |
          set -e

          BASE_URL="https://raw.githubusercontent.com/swgoh-utils/gamedata/main"

          echo ""
          echo "================================================================================"
          echo "POBIERANIE AKTUALNEGO GAME DATA"
          echo "================================================================================"
          echo ""

          # --------------------------------------------------------
          # UNITS
          # --------------------------------------------------------

          echo "Pobieranie units.json.br..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/units.json.br" \
            -o units_raw.json.br

          test -s units_raw.json.br

          echo "Rozpakowywanie units.json.br..."

          python - <<'PY'
          import brotli

          with open(
              "units_raw.json.br",
              "rb"
          ) as f:
              compressed = f.read()

          raw = brotli.decompress(
              compressed
          )

          with open(
              "units_raw.json",
              "wb"
          ) as f:
              f.write(raw)

          print(
              "OK: units_raw.json"
          )

          print(
              "Rozmiar po rozpakowaniu:",
              len(raw),
              "bytes"
          )
          PY

          test -s units_raw.json

          # --------------------------------------------------------
          # EQUIPMENT
          # --------------------------------------------------------

          echo ""
          echo "Pobieranie equipment.json..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/equipment.json" \
            -o equipment_raw.json

          test -s equipment_raw.json

          # --------------------------------------------------------
          # RECIPE
          # --------------------------------------------------------

          echo ""
          echo "Pobieranie recipe.json..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/recipe.json" \
            -o recipe_raw.json

          test -s recipe_raw.json

          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          echo ""
          echo "Rozmiary plików:"

          wc -c \
            units_raw.json \
            units_raw.json.br \
            equipment_raw.json \
            recipe_raw.json

          echo ""
          echo "Walidacja JSON..."

          python -m json.tool \
            units_raw.json \
            >/dev/null

          python -m json.tool \
            equipment_raw.json \
            >/dev/null

          python -m json.tool \
            recipe_raw.json \
            >/dev/null

          echo "JSON OK."

      # ============================================================
      # BUILD DATA.JSON
      # ============================================================

      - name: Build data.json
        run: |
          set -e

          python - <<'PY'
          import json


          def load_collection(filename):

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:

                  obj = json.load(f)


              if not isinstance(
                  obj,
                  dict
              ):
                  raise RuntimeError(
                      f"{filename}: oczekiwano obiektu JSON."
                  )


              data = obj.get(
                  "data"
              )


              if not isinstance(
                  data,
                  list
              ):
                  raise RuntimeError(
                      f"{filename}: brak kolekcji data."
                  )


              if not data:
                  raise RuntimeError(
                      f"{filename}: kolekcja data jest pusta."
                  )


              print(
                  filename,
                  "->",
                  len(data)
              )


              return data


          units = load_collection(
              "units_raw.json"
          )

          equipment = load_collection(
              "equipment_raw.json"
          )

          recipe = load_collection(
              "recipe_raw.json"
          )


          game_data = {
              "units": units,
              "equipment": equipment,
              "recipe": recipe
          }


          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  game_data,
                  f,
                  ensure_ascii=False
              )


          print("")
          print(
              "Wygenerowano data.json"
          )

          print(
              "units:",
              len(units)
          )

          print(
              "equipment:",
              len(equipment)
          )

          print(
              "recipe:",
              len(recipe)
          )

          PY

          test -s data.json

      # ============================================================
      # DOWNLOAD LOCALIZATION
      # ============================================================

      - name: Download current localization
        run: |
          set -e

          BASE_URL="https://raw.githubusercontent.com/swgoh-utils/gamedata/main"

          echo ""
          echo "Pobieranie ENG_US localization..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/Loc_ENG_US.txt.json.br" \
            -o localization.json.br

          test -s localization.json.br

          wc -c localization.json.br

      # ============================================================
      # BUILD LOCALIZATION.JSON
      # ============================================================

      - name: Build localization.json
        run: |
          set -e

          python - <<'PY'
          import json
          import brotli


          with open(
              "localization.json.br",
              "rb"
          ) as f:

              compressed = f.read()


          raw = brotli.decompress(
              compressed
          )


          localization = json.loads(
              raw.decode("utf-8")
          )


          if not isinstance(
              localization,
              dict
          ):
              raise RuntimeError(
                  "Localization nie jest obiektem JSON."
              )


          # ========================================================
          # DEBUG LOCALIZATION
          # ========================================================

          print("")
          print("=" * 80)
          print("DEBUG LOCALIZATION")
          print("=" * 80)

          print(
              "TOP LEVEL KEYS:",
              list(localization.keys())
          )

          for key, value in localization.items():

              print("")
              print(
                  "KEY:",
                  key
              )

              print(
                  "TYPE:",
                  type(value).__name__
              )

              if isinstance(
                  value,
                  list
              ):

                  print(
                      "LIST LENGTH:",
                      len(value)
                  )

                  if value:

                      print(
                          "FIRST ITEM:",
                          value[0]
                      )

              elif isinstance(
                  value,
                  dict
              ):

                  print(
                      "DICT KEYS:",
                      list(value.keys())[:20]
                  )

                  print(
                      "DICT SAMPLE:",
                      list(value.items())[:3]
                  )

          print("")
          print("=" * 80)
          print("END DEBUG LOCALIZATION")
          print("=" * 80)
          print("")


          with open(
              "localization.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  localization,
                  f,
                  ensure_ascii=False
              )


          print(
              "Wygenerowano localization.json"
          )

          print(
              "Liczba wpisów:",
              len(localization)
          )

          PY

          test -s localization.json

      # ============================================================
      # VALIDATE ALL INPUT DATA
      # ============================================================

      - name: Validate input data
        run: |
          set -e

          python - <<'PY'
          import json


          with open(
              "swgoh_972824625.json",
              encoding="utf-8"
          ) as f:

              player = json.load(f)


          with open(
              "data.json",
              encoding="utf-8"
          ) as f:

              game = json.load(f)


          with open(
              "localization.json",
              encoding="utf-8"
          ) as f:

              localization = json.load(f)


          roster = player.get(
              "rosterUnit",
              []
          )

          units = game.get(
              "units",
              []
          )

          equipment = game.get(
              "equipment",
              []
          )

          recipes = game.get(
              "recipe",
              []
          )


          print(
              "Roster:",
              len(roster)
          )

          print(
              "Units:",
              len(units)
          )

          print(
              "Equipment:",
              len(equipment)
          )

          print(
              "Recipes:",
              len(recipes)
          )

          print(
              "Localization:",
              len(localization)
          )


          if not roster:
              raise RuntimeError(
                  "Roster jest pusty."
              )

          if not units:
              raise RuntimeError(
                  "Units jest puste."
              )

          if not equipment:
              raise RuntimeError(
                  "Equipment jest puste."
              )

          if not recipes:
              raise RuntimeError(
                  "Recipe jest puste."
              )

          if not localization:
              raise RuntimeError(
                  "Localization jest pusta."
              )


          print("")
          print(
              "Wszystkie wymagane dane są dostępne."
          )

          PY

      # ============================================================
      # GENERATE ROSTER CSV
      # ============================================================

      - name: Generate roster CSV
        run: |
          set -e

          python - <<'PY'
          import csv
          import json


          with open(
              "swgoh_972824625.json",
              encoding="utf-8"
          ) as f:

              player = json.load(f)


          with open(
              "data.json",
              encoding="utf-8"
          ) as f:

              game = json.load(f)


          units = {}


          for unit in game.get(
              "units",
              []
          ):

              base_id = unit.get(
                  "baseId"
              )

              if base_id:
                  units[base_id] = unit


          rows = []


          for unit in player.get(
              "rosterUnit",
              []
          ):

              definition_id = unit.get(
                  "definitionId",
                  ""
              )

              if not definition_id:
                  continue


              base_id = definition_id.split(
                  ":",
                  1
              )[0]


              game_unit = units.get(
                  base_id,
                  {}
              )


              if game_unit.get(
                  "combatType"
              ) != 1:
                  continue


              rows.append({
                  "name": base_id,
                  "baseId": base_id,
                  "definitionId": definition_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get(
                          "relic"
                      ) or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })


          fields = [
              "name",
              "baseId",
              "definitionId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]


          with open(
              "roster.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(rows)


          print(
              "Wygenerowano roster.csv"
          )

          print(
              "Liczba postaci:",
              len(rows)
          )

          PY

          test -s roster.csv

      # ============================================================
      # GENERATE SHIPS CSV
      # ============================================================

      - name: Generate ships CSV
        run: |
          set -e

          python - <<'PY'
          import csv
          import json


          with open(
              "swgoh_972824625.json",
              encoding="utf-8"
          ) as f:

              player = json.load(f)


          with open(
              "data.json",
              encoding="utf-8"
          ) as f:

              game = json.load(f)


          units = {}


          for unit in game.get(
              "units",
              []
          ):

              base_id = unit.get(
                  "baseId"
              )

              if base_id:
                  units[base_id] = unit


          rows = []


          for unit in player.get(
              "rosterUnit",
              []
          ):

              definition_id = unit.get(
                  "definitionId",
                  ""
              )

              if not definition_id:
                  continue


              base_id = definition_id.split(
                  ":",
                  1
              )[0]


              game_unit = units.get(
                  base_id,
                  {}
              )


              if game_unit.get(
                  "combatType"
              ) != 2:
                  continue


              rows.append({
                  "name": base_id,
                  "definitionId": definition_id,
                  "baseId": base_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get(
                          "relic"
                      ) or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })


          fields = [
              "name",
              "definitionId",
              "baseId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]


          with open(
              "ships.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(rows)


          print("")
          print("=" * 60)
          print("SHIPS")
          print("=" * 60)
          print("")
          print(
              "Wygenerowano ships.csv"
          )
          print(
              "Liczba statków:",
              len(rows)
          )
          print("")

          for row in rows:

              print(
                  f"{row['name']} | "
                  f"{row['rarity']} ★ | "
                  f"Level {row['level']} | "
                  f"G{row['gearTier']}"
              )

          PY

          test -s ships.csv

      # ============================================================
      # GENERATE MODS CSV
      # ============================================================

      - name: Generate mods CSV
        run: |
          set -e

          python generate_mods.py

          test -s mods.csv

          echo ""
          echo "=============================================="
          echo "MODS"
          echo "=============================================="

          echo "Liczba modów:"
          tail -n +2 mods.csv | wc -l

          echo ""
          echo "Pierwsze 5 rekordów:"
          head -n 6 mods.csv

      # ============================================================
      # MOD ANALYSIS
      # ============================================================

      - name: Generate mod analysis
        run: |
          set -e

          python mod_analyzer.py

          test -s mod_analysis.csv
          test -s mod_analysis.md

          echo ""
          echo "=============================================="
          echo "MOD ANALYSIS"
          echo "=============================================="

          head -n 15 mod_analysis.md

      # ============================================================
      # SHIP ANALYSIS
      # ============================================================

      - name: Generate ship analysis
        run: |
          set -e

          python ship_analysis.py

          test -s ship_analysis.md

          echo "Wygenerowano ship_analysis.md"

      # ============================================================
      # FLEET ANALYSIS
      # ============================================================

      - name: Generate fleet analysis
        run: |
          set -e

          python fleet_analysis.py

          test -s fleet_analysis.md

          echo "Wygenerowano fleet_analysis.md"

      # ============================================================
      # FARMING RESOURCES
      # ============================================================

      - name: Calculate farming resources
        run: |
          set -e

          python calculate_resources.py

          test -s account_farming_report.md

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated files
        run: |
          set -e

          test -s roster.csv
          test -s ships.csv
          test -s mods.csv
          test -s mod_analysis.csv
          test -s mod_analysis.md
          test -s account_farming_report.md
          test -s ship_analysis.md
          test -s fleet_analysis.md

          echo ""
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          ls -lh \
            roster.csv \
            ships.csv \
            mods.csv \
            mod_analysis.csv \
            mod_analysis.md \
            account_farming_report.md \
            ship_analysis.md \
            fleet_analysis.md

          echo ""
          echo "Liczba postaci:"
          tail -n +2 roster.csv | wc -l

          echo ""
          echo "Liczba statków:"
          tail -n +2 ships.csv | wc -l

          echo ""
          echo "Liczba modów:"
          tail -n +2 mods.csv | wc -l

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit generated files
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            roster.csv \
            ships.csv \
            mods.csv \
            mod_analysis.csv \
            mod_analysis.md \
            account_farming_report.md \
            ship_analysis.md \
            fleet_analysis.md

          if git diff --cached --quiet; then

            echo "Brak zmian."

          else

            git commit \
              -m "Update SWGOH data"

            git push

          fi

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Stop Comlink
        if: always()
        run: |
          docker rm -f swgoh-comlink 2>/dev/null || true
