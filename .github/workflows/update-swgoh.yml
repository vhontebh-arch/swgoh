name: Update SWGOH data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start Comlink
        run: |
          docker pull ghcr.io/swgoh-utils/swgoh-comlink:latest

          docker run -d \
            --name swgoh-comlink \
            --env APP_NAME="Vhonte SWGOH updater" \
            -p 3000:3000 \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

      - name: Download player data
        run: |
          sleep 10

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"payload":{"allyCode":"972824625"}}' \
            http://localhost:3000/player \
            -o swgoh_972824625.json

          python -m json.tool swgoh_972824625.json > /dev/null

          echo "Pobrano dane:"
          wc -c swgoh_972824625.json

      - name: Test Comlink metadata
        run: |
          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://localhost:3000/metadata \
            -o metadata.json

          python -m json.tool metadata.json | head -n 40

      - name: Test Comlink data
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("metadata.json"))["latestGamedataVersion"])')

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"payload\":{\"version\":\"$VERSION\",\"items\":\"-1\"}}" \
            http://localhost:3000/data \
            -o data.json

          python -m json.tool data.json | head -n 40

      - name: Summarize gear and relic costs
        run: |
          python - <<'PY'
          import json

          data = json.load(open("data.json", encoding="utf-8"))

          def walk(obj):
              yield obj
              if isinstance(obj, dict):
                  for v in obj.values():
                      yield from walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from walk(v)

          # -------------------------------------------------
          # Gear recipes
          # -------------------------------------------------

          wanted = {
              "098", "102", "117", "122",
              "116", "125", "129", "134", "142", "144", "146",
              "158", "159", "160", "168", "174",
              "G12Finisher_JARJARBINKS_C",
              "176Ingredient",
              "170Prototype",
              "123Prototype",
              "172Prototype"
          }

          recipes = {}

          for node in walk(data):
              if not isinstance(node, dict):
                  continue

              ingredients = node.get("ingredients")

              if not isinstance(ingredients, list):
                  continue

              node_id = str(node.get("id", ""))

              for ing in ingredients:
                  if not isinstance(ing, dict):
                      continue

                  if str(ing.get("id", "")) in wanted:
                      recipes[node_id] = node
                      break

          print("=== GEAR RECIPE SUMMARY ===")

          for recipe_id in sorted(recipes):
              node = recipes[recipe_id]

              parts = []

              for ing in node.get("ingredients", []):
                  iid = str(ing.get("id", ""))
                  qty = ing.get("minQuantity", 1)

                  parts.append(f"{iid} x{qty}")

              result = node.get("result", {})
              result_id = result.get("id", "?")

              print(
                  f"{recipe_id} -> {result_id}: "
                  + ", ".join(parts)
              )

          print()
          print(f"RECIPES FOUND: {len(recipes)}")

          # -------------------------------------------------
          # Relic promotion table
          # -------------------------------------------------

          print()
          print("=== RELIC PROMOTION TABLE SUMMARY ===")

          relic_tables = []

          for node in walk(data):
              if not isinstance(node, dict):
                  continue

              node_id = str(node.get("id", ""))

              if (
                  node_id == "relic_promotion_table"
                  or "relic_promotion" in node_id.lower()
              ):
                  relic_tables.append(node)

          print(f"TABLES FOUND: {len(relic_tables)}")

          for table in relic_tables:
              print(f"TABLE ID: {table.get('id')}")

              # pokaż tylko nazwy pól najwyższego poziomu
              print(
                  "FIELDS:",
                  ", ".join(sorted(table.keys()))
              )

              # szukamy struktur zawierających tier/koszt
              for key, value in table.items():

                  if key == "id":
                      continue

                  if isinstance(value, (list, dict)):
                      text = json.dumps(
                          value,
                          ensure_ascii=False,
                          separators=(",", ":")
                      )

                      if any(
                          x in text.lower()
                          for x in (
                              "tier",
                              "material",
                              "quantity",
                              "cost",
                              "rm_",
                              "signal"
                          )
                      ):
                          print(f"{key}: {text[:3000]}")

          # -------------------------------------------------
          # Save compact diagnostic file
          # -------------------------------------------------

          with open(
              "gear_relic_diagnostic.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write("GEAR RECIPES\n")

              for recipe_id in sorted(recipes):
                  node = recipes[recipe_id]

                  parts = []

                  for ing in node.get("ingredients", []):
                      parts.append(
                          f"{ing.get('id')} x{ing.get('minQuantity', 1)}"
                      )

                  f.write(
                      f"{recipe_id} -> "
                      f"{node.get('result', {}).get('id', '?')}: "
                      + ", ".join(parts)
                      + "\n"
                  )

              f.write("\nRELIC TABLES\n")

              for table in relic_tables:
                  f.write(
                      json.dumps(
                          table,
                          indent=2,
                          ensure_ascii=False
                      )
                  )
                  f.write("\n")

          PY

          echo
          echo "=== COMPACT RESULT ==="
          cat gear_relic_diagnostic.txt
          
      - name: Download English localization
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("metadata.json"))["latestLocalizationBundleVersion"])')

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"payload\":{\"id\":\"${VERSION}:ENG_US\"}}" \
            http://localhost:3000/localization \
            -o localization.json

          python -c 'import json; d=json.load(open("localization.json")); print("Klucze odpowiedzi:",list(d.keys())); print("Rozmiar odpowiedzi:",len(open("localization.json","rb").read()),"bytes")'

      - name: Generate roster CSV
        run: |
          python -c 'import csv,json,base64,zipfile,io; d=json.load(open("swgoh_972824625.json")); loc=json.load(open("localization.json")); z=zipfile.ZipFile(io.BytesIO(base64.b64decode(loc["localizationBundle"]))); lines=z.read("Loc_ENG_US.txt").decode("utf-8","replace").splitlines(); names={x.split("|",1)[0]:x.split("|",1)[1] for x in lines if "|" in x}; f=open("roster.csv","w",newline="",encoding="utf-8"); w=csv.writer(f); w.writerow(["name","definitionId","baseId","id","rarity","level","gearTier","relicTier"]); [w.writerow([names.get("UNIT_"+next((s["id"].replace("basicskill_","") for s in u.get("skill",[]) if s["id"].startswith("basicskill_")),"")+"_NAME",""),u.get("definitionId",""),next((s["id"].replace("basicskill_","") for s in u.get("skill",[]) if s["id"].startswith("basicskill_")),""),u.get("id",""),u.get("currentRarity",""),u.get("currentLevel",""),u.get("currentTier",""),(u.get("relic") or {}).get("currentTier","")]) for u in d["rosterUnit"]]; f.close(); print("Wygenerowano roster.csv")'

      - name: Verify roster CSV
        run: |
          echo "Liczba jednostek:"
          tail -n +2 roster.csv | wc -l

          echo
          echo "Pierwsze 10 jednostek:"
          head -n 11 roster.csv

          echo
          echo "Admiral Piett:"
          grep "ADMIRALPIETT" roster.csv || true

      - name: Generate ships CSV
        run: |
          cat > generate_ships.py <<'PY'
          import csv
          import json
          import base64
          import zipfile
          import io

          player = json.load(
              open("swgoh_972824625.json", encoding="utf-8")
          )

          game = json.load(
              open("data.json", encoding="utf-8")
          )

          localization = json.load(
              open("localization.json", encoding="utf-8")
          )

          bundle = base64.b64decode(
              localization["localizationBundle"]
          )

          z = zipfile.ZipFile(
              io.BytesIO(bundle)
          )

          lines = z.read(
              "Loc_ENG_US.txt"
          ).decode(
              "utf-8",
              "replace"
          ).splitlines()

          names = {}

          for line in lines:
              if "|" in line:
                  key, value = line.split("|", 1)
                  names[key] = value

          units = {}

          for unit in game.get("units", []):
              base_id = unit.get("baseId")

              if base_id:
                  units[base_id] = unit

          ships = []

          for unit in player.get("rosterUnit", []):
              base_id = ""

              for skill in unit.get("skill", []):
                  skill_id = skill.get("id", "")

                  if skill_id.startswith("basicskill_"):
                      base_id = skill_id.replace(
                          "basicskill_",
                          ""
                      )
                      break

              game_unit = units.get(base_id, {})

              if game_unit.get("combatType") != 2:
                  continue

              name_key = game_unit.get("nameKey", "")

              name = names.get(
                  name_key,
                  names.get(
                      "UNIT_" + base_id + "_NAME",
                      base_id
                  )
              )

              ships.append({
                  "name": name,
                  "definitionId": unit.get(
                      "definitionId",
                      ""
                  ),
                  "baseId": base_id,
                  "id": unit.get("id", ""),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get("relic") or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })

          fields = [
              "name",
              "definitionId",
              "baseId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]

          with open(
              "ships.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(ships)

          print("Wygenerowano ships.csv")
          print("Liczba statków:", len(ships))

          for ship in ships[:10]:
              print(
                  ship["name"],
                  "|",
                  ship["baseId"],
                  "|",
                  ship["rarity"],
                  "★"
              )
          PY

          python generate_ships.py
          
      - name: Commit roster CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add roster.csv ships.csv

          if git diff --cached --quiet; then
            echo "Brak zmian roster CSV"
          else
            git commit -m "Update roster CSV"
            git push
          fi
