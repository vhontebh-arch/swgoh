name: Update SWGOH data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test Python
        run: |
          python --version
          python -c "print('Python działa poprawnie')"

      - name: Test repository
        run: |
          echo "Repozytorium:"
          pwd
          echo "Pliki:"
          find . -maxdepth 2 -type f | sort

      - name: Validate existing JSON
        run: |
          python -m json.tool swgoh_972824625.json > /dev/null
          echo "JSON jest poprawny"

      - name: Check for changes
        run: git status --short
