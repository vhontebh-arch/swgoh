name: Update SWGOH data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download player data
        run: |
          curl -L \
            "https://swgoh4.life/api/player/972824625" \
            -o swgoh_972824625.json

      - name: Download game data
        run: |
          curl -L \
            "https://swgoh4.life/api/data" \
            -o data.json

      - name: Download localization
        run: |
          curl -L \
            "https://swgoh4.life/api/localization" \
            -o localization.json

      - name: Generate roster CSV
        run: |
          python - <<'PY'
          import csv
          import json

          player = json.load(
              open("swgoh_972824625.json", encoding="utf-8")
          )

          game = json.load(
              open("data.json", encoding="utf-8")
          )

          units = {}

          for unit in game.get("units", []):
              base_id = unit.get("baseId")

              if base_id:
                  units[base_id] = unit

          rows = []

          for unit in player.get("rosterUnit", []):
              base_id = ""

              for skill in unit.get("skill", []):
                  skill_id = skill.get("id", "")

                  if skill_id.startswith("basicskill_"):
                      base_id = skill_id.replace(
                          "basicskill_",
                          ""
                      )
                      break

              game_unit = units.get(base_id, {})

              if game_unit.get("combatType") != 1:
                  continue

              rows.append({
                  "name": base_id,
                  "baseId": base_id,
                  "definitionId": unit.get(
                      "definitionId",
                      ""
                  ),
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get("relic") or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })

          fields = [
              "name",
              "baseId",
              "definitionId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]

          with open(
              "roster.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(rows)

          print("Wygenerowano roster.csv")
          print("Liczba postaci:", len(rows))
          PY

      - name: Generate ships CSV
        run: |
          cat > generate_ships.py <<'PY'
          import csv
          import json
          import base64
          import zipfile
          import io

          player = json.load(
              open("swgoh_972824625.json", encoding="utf-8")
          )

          game = json.load(
              open("data.json", encoding="utf-8")
          )

          localization = json.load(
              open("localization.json", encoding="utf-8")
          )

          bundle = base64.b64decode(
              localization["localizationBundle"]
          )

          z = zipfile.ZipFile(
              io.BytesIO(bundle)
          )

          lines = z.read(
              "Loc_ENG_US.txt"
          ).decode(
              "utf-8",
              "replace"
          ).splitlines()

          names = {}

          for line in lines:
              if "|" in line:
                  key, value = line.split("|", 1)
                  names[key] = value

          units = {}

          for unit in game.get("units", []):
              base_id = unit.get("baseId")

              if base_id:
                  units[base_id] = unit

          ships = []

          for unit in player.get("rosterUnit", []):

              # --------------------------------------------------------
              # IMPORTANT:
              # Ship identity is taken from definitionId.
              #
              # Example:
              # SLAVE1:SEVEN_STAR -> SLAVE1
              #
              # This replaces the old basicskill_ detection, which
              # failed to identify at least one owned ship.
              # --------------------------------------------------------

              definition_id = unit.get(
                  "definitionId",
                  ""
              )

              if not definition_id:
                  continue

              base_id = definition_id.split(
                  ":",
                  1
              )[0]

              game_unit = units.get(
                  base_id,
                  {}
              )

              if game_unit.get("combatType") != 2:
                  continue

              name_key = game_unit.get(
                  "nameKey",
                  ""
              )

              name = names.get(
                  name_key,
                  names.get(
                      "UNIT_" + base_id + "_NAME",
                      base_id
                  )
              )

              ships.append({
                  "name": name,
                  "definitionId": definition_id,
                  "baseId": base_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get("relic") or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })

          fields = [
              "name",
              "definitionId",
              "baseId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]

          with open(
              "ships.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(ships)

          print("Wygenerowano ships.csv")
          print("Liczba statków:", len(ships))

          print("")
          print("Kontrola kluczowych statków:")

          important_ships = [
              "SLAVE1",
              "RAZORCREST",
              "IG2000",
              "HOUNDSTOOTH",
              "TIEADVANCED",
              "TIEBOMBERIMPERIAL",
              "TIEFIGHTERIMPERIAL",
              "OUTRIDER",
              "B28EXTINCTIONCLASSBOMBER",
              "MARKVIINTERCEPTOR",
              "TIEDAGGER",
              "EBONHAWK",
              "SCIMITAR"
          ]

          ships_by_base_id = {
              ship["baseId"]: ship
              for ship in ships
          }

          for base_id in important_ships:

              ship = ships_by_base_id.get(
                  base_id
              )

              if ship:
                  print(
                      "OK   |",
                      base_id,
                      "|",
                      ship["name"],
                      "|",
                      ship["rarity"],
                      "★",
                      "|",
                      ship["definitionId"]
                  )
              else:
                  print(
                      "BRAK |",
                      base_id
                  )

          print("")
          print("Statystyka gwiazdek:")

          star_counts = {}

          for ship in ships:
              rarity = ship["rarity"]

              star_counts[rarity] = (
                  star_counts.get(
                      rarity,
                      0
                  ) + 1
              )

          for rarity in sorted(
              star_counts,
              reverse=True
          ):
              print(
                  rarity,
                  "★:",
                  star_counts[rarity]
              )
          PY

          python generate_ships.py

      - name: Generate ship analysis
        run: |
          python ship_analysis.py
          echo "Wygenerowano ship_analysis.md"

      - name: Generate fleet analysis
        run: |
          python fleet_analysis.py
          echo "Wygenerowano fleet_analysis.md"

      - name: Calculate farming resources
        run: |
          python calculate_resources.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            roster.csv \
            ships.csv \
            account_farming_report.md \
            ship_analysis.md \
            fleet_analysis.md

          if git diff --cached --quiet; then
            echo "Brak zmian"
          else
            git commit -m "Update SWGOH data"
            git push
          fi
