```yaml
name: Update SWGOH data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start Comlink
        run: |
          docker pull ghcr.io/swgoh-utils/swgoh-comlink:latest

          docker run -d \
            --name swgoh-comlink \
            --env APP_NAME="Vhonte SWGOH updater" \
            -p 3000:3000 \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

      - name: Download player data
        run: |
          sleep 10

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"payload":{"allyCode":"972824625"}}' \
            http://localhost:3000/player \
            -o swgoh_972824625.json

          python -m json.tool swgoh_972824625.json > /dev/null

          echo "Pobrano dane:"
          wc -c swgoh_972824625.json

      - name: Download current metadata
        run: |
          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://localhost:3000/metadata \
            -o metadata.json

          python -m json.tool metadata.json > /dev/null

      - name: Download current game data
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("metadata.json"))["latestGamedataVersion"])')

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"payload\":{\"version\":\"$VERSION\",\"items\":\"-1\"}}" \
            http://localhost:3000/data \
            -o data.json

          python -m json.tool data.json > /dev/null

          echo "Game data:"
          wc -c data.json

      - name: Download English localization
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("metadata.json"))["latestLocalizationBundleVersion"])')

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"payload\":{\"id\":\"${VERSION}:ENG_US\"}}" \
            http://localhost:3000/localization \
            -o localization.json

          python -c 'import json; d=json.load(open("localization.json")); print("Klucze odpowiedzi:",list(d.keys())); print("Rozmiar odpowiedzi:",len(open("localization.json","rb").read()),"bytes")'

      - name: Generate account CSV files
        run: |
          cat > generate_csv.py <<'PY'
          import csv
          import json
          import base64
          import zipfile
          import io

          PLAYER_FILE = "swgoh_972824625.json"
          DATA_FILE = "data.json"
          LOCALIZATION_FILE = "localization.json"

          player = json.load(open(PLAYER_FILE, encoding="utf-8"))
          game_data = json.load(open(DATA_FILE, encoding="utf-8"))
          localization = json.load(open(LOCALIZATION_FILE, encoding="utf-8"))

          # ------------------------------------------------------------
          # Localization
          # ------------------------------------------------------------

          bundle = base64.b64decode(localization["localizationBundle"])
          z = zipfile.ZipFile(io.BytesIO(bundle))

          loc_file = z.read("Loc_ENG_US.txt").decode(
              "utf-8",
              "replace"
          )

          names = {}

          for line in loc_file.splitlines():
              if "|" in line:
                  key, value = line.split("|", 1)
                  names[key] = value

          # ------------------------------------------------------------
          # Game-data unit lookup
          # ------------------------------------------------------------

          units = {}

          for unit in game_data.get("units", []):
              base_id = unit.get("baseId")

              if base_id:
                  units[base_id] = unit

          def unit_name(base_id):
              unit = units.get(base_id, {})
              name_key = unit.get("nameKey", "")

              return names.get(
                  name_key,
                  names.get("UNIT_" + base_id + "_NAME", base_id)
              )

          def get_base_id(roster_unit):
              for skill in roster_unit.get("skill", []):
                  skill_id = skill.get("id", "")

                  if skill_id.startswith("basicskill_"):
                      return skill_id.replace("basicskill_", "")

              return ""

          # -------------
