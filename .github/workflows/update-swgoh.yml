name: Update SWGOH data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -e

          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            swgoh_comlink==2.3.0 \
            brotli

      # ============================================================
      # START COMLINK
      # ============================================================

      - name: Start SWGOH Comlink
        run: |
          set -e

          echo "Pobieranie SWGOH Comlink..."

          docker pull \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

          echo "Uruchamianie Comlink..."

          docker run \
            --name swgoh-comlink \
            -d \
            -p 3000:3000 \
            -e APP_NAME=vhonte-swgoh-github-actions \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

          echo "Oczekiwanie na Comlink..."

          for i in $(seq 1 30); do

            if curl -fsS \
              "http://127.0.0.1:3000/" \
              >/dev/null 2>&1
            then

              echo "Comlink działa."
              exit 0

            fi

            echo "Próba $i/30..."
            sleep 2

          done

          echo ""
          echo "ERROR: Comlink nie wystartował."
          echo ""
          docker logs swgoh-comlink

          exit 1

      # ============================================================
      # DOWNLOAD PLAYER DATA
      # ============================================================

      - name: Download player data
        run: |
          set -e

          python - <<'PY'
          import json

          from swgoh_comlink import SwgohComlink


          ALLY_CODE = 972824625
          COMLINK_URL = "http://127.0.0.1:3000"


          print("")
          print("=" * 80)
          print("POBIERANIE PLAYER DATA")
          print("=" * 80)
          print("")


          with SwgohComlink(
              url=COMLINK_URL,
              version_cache_ttl=0
          ) as comlink:

              player = comlink.get_player(
                  allycode=ALLY_CODE,
                  enums=False
              )


          if not isinstance(
              player,
              dict
          ):
              raise RuntimeError(
                  "Player data nie jest obiektem JSON."
              )


          roster = player.get(
              "rosterUnit",
              []
          )


          if not roster:
              raise RuntimeError(
                  "Player data nie zawiera rosterUnit."
              )


          with open(
              "swgoh_972824625.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  player,
                  f,
                  ensure_ascii=False
              )


          print(
              "OK: player data"
          )

          print(
              "Liczba rosterUnit:",
              len(roster)
          )

          PY

      # ============================================================
      # DOWNLOAD CURRENT GAME DATA
      # ============================================================

      - name: Download current game data
        run: |
          set -e

          BASE_URL="https://raw.githubusercontent.com/swgoh-utils/gamedata/main"

          echo ""
          echo "=" * 80
          echo "POBIERANIE AKTUALNEGO GAME DATA"
          echo "=" * 80
          echo ""

          # --------------------------------------------------------
          # UNITS
          # --------------------------------------------------------

          echo "Pobieranie units.json.br..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/units.json.br" \
            -o units_raw.json.br

          test -s units_raw.json.br

          echo "Rozpakowywanie units.json.br..."

          python - <<'PY'
          import brotli

          with open(
              "units_raw.json.br",
              "rb"
          ) as f:
              compressed = f.read()

          raw = brotli.decompress(
              compressed
          )

          with open(
              "units_raw.json",
              "wb"
          ) as f:
              f.write(raw)

          print(
              "OK: units_raw.json"
          )

          print(
              "Rozmiar po rozpakowaniu:",
              len(raw),
              "bytes"
          )
          PY

          test -s units_raw.json

          # --------------------------------------------------------
          # EQUIPMENT
          # --------------------------------------------------------

          echo ""
          echo "Pobieranie equipment.json..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/equipment.json" \
            -o equipment_raw.json

          test -s equipment_raw.json

          # --------------------------------------------------------
          # RECIPE
          # --------------------------------------------------------

          echo ""
          echo "Pobieranie recipe.json..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/recipe.json" \
            -o recipe_raw.json

          test -s recipe_raw.json

          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          echo ""
          echo "Rozmiary plików:"

          wc -c \
            units_raw.json \
            units_raw.json.br \
            equipment_raw.json \
            recipe_raw.json

          echo ""
          echo "Walidacja JSON..."

          python -m json.tool \
            units_raw.json \
            >/dev/null

          python -m json.tool \
            equipment_raw.json \
            >/dev/null

          python -m json.tool \
            recipe_raw.json \
            >/dev/null

          echo "JSON OK."

      # ============================================================
      # BUILD DATA.JSON
      # ============================================================

      - name: Build data.json
        run: |
          set -e

          python - <<'PY'
          import json


          def load_collection(filename):

              with open(
                  filename,
                  encoding="utf-8"
              ) as f:

                  obj = json.load(f)


              if not isinstance(
                  obj,
                  dict
              ):
                  raise RuntimeError(
                      f"{filename}: oczekiwano obiektu JSON."
                  )


              data = obj.get(
                  "data"
              )


              if not isinstance(
                  data,
                  list
              ):
                  raise RuntimeError(
                      f"{filename}: brak kolekcji data."
                  )


              if not data:
                  raise RuntimeError(
                      f"{filename}: kolekcja data jest pusta."
                  )


              print(
                  filename,
                  "->",
                  len(data)
              )


              return data


          units = load_collection(
              "units_raw.json"
          )

          equipment = load_collection(
              "equipment_raw.json"
          )

          recipe = load_collection(
              "recipe_raw.json"
          )


          game_data = {
              "units": units,
              "equipment": equipment,
              "recipe": recipe
          }


          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  game_data,
                  f,
                  ensure_ascii=False
              )


          print("")
          print(
              "Wygenerowano data.json"
          )

          print(
              "units:",
              len(units)
          )

          print(
              "equipment:",
              len(equipment)
          )

          print(
              "recipe:",
              len(recipe)
          )

          PY

      # ============================================================
      # DOWNLOAD LOCALIZATION
      # ============================================================

      - name: Download current localization
        run: |
          set -e

          BASE_URL="https://raw.githubusercontent.com/swgoh-utils/gamedata/main"

          echo ""
          echo "Pobieranie ENG_US localization..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "$BASE_URL/Loc_ENG_US.txt.json.br" \
            -o localization.json.br

          echo ""
          echo "Rozmiar:"

          wc -c localization.json.br

          test -s localization.json.br

      # ============================================================
      # BUILD LOCALIZATION.JSON
      # ============================================================

      - name: Build localization.json
        run: |
          set -e

          python - <<'PY'
          import json
          import brotli


          with open(
              "localization.json.br",
              "rb"
          ) as f:

              compressed = f.read()


          raw = brotli.decompress(
              compressed
          )


          localization = json.loads(
              raw.decode(
                  "utf-8"
              )
          )


          if not isinstance(
              localization,
              dict
          ):
              raise RuntimeError(
                  "Localization nie jest obiektem JSON."
              )


          with open(
              "localization.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  localization,
                  f,
                  ensure_ascii=False
              )


          print(
              "Wygenerowano localization.json"
          )

          print(
              "Liczba wpisów:",
              len(localization)
          )

          PY

          test -s localization.json

      # ============================================================
      # VALIDATE ALL INPUT DATA
      # ============================================================

      - name: Validate input data
        run: |
          set -e

          echo ""
          echo "=" * 80
          echo "WALIDACJA DANYCH"
          echo "=" * 80
          echo ""

          python - <<'PY'
          import json


          player = json.load(
              open(
                  "swgoh_972824625.json",
                  encoding="utf-8"
              )
          )


          game = json.load(
              open(
                  "data.json",
                  encoding="utf-8"
              )
          )


          localization = json.load(
              open(
                  "localization.json",
                  encoding="utf-8"
              )
          )


          roster = player.get(
              "rosterUnit",
              []
          )

          units = game.get(
              "units",
              []
          )

          equipment = game.get(
              "equipment",
              []
          )

          recipes = game.get(
              "recipe",
              []
          )


          print(
              "Roster:",
              len(roster)
          )

          print(
              "Units:",
              len(units)
          )

          print(
              "Equipment:",
              len(equipment)
          )

          print(
              "Recipes:",
              len(recipes)
          )

          print(
              "Localization:",
              len(localization)
          )


          if len(roster) == 0:
              raise RuntimeError(
                  "Roster jest pusty."
              )


          if len(units) == 0:
              raise RuntimeError(
                  "Units jest puste."
              )


          if len(equipment) == 0:
              raise RuntimeError(
                  "Equipment jest puste."
              )


          if len(recipes) == 0:
              raise RuntimeError(
                  "Recipe jest puste."
              )


          if len(localization) == 0:
              raise RuntimeError(
                  "Localization jest pusta."
              )


          print("")
          print(
              "Wszystkie wymagane dane są dostępne."
          )

          PY

      # ============================================================
      # GENERATE ROSTER CSV
      # ============================================================

      - name: Generate roster CSV
        run: |
          set -e

          python - <<'PY'
          import csv
          import json


          player = json.load(
              open(
                  "swgoh_972824625.json",
                  encoding="utf-8"
              )
          )


          game = json.load(
              open(
                  "data.json",
                  encoding="utf-8"
              )
          )


          units = {}


          for unit in game.get(
              "units",
              []
          ):

              base_id = unit.get(
                  "baseId"
              )

              if base_id:
                  units[base_id] = unit


          rows = []


          for unit in player.get(
              "rosterUnit",
              []
          ):

              definition_id = unit.get(
                  "definitionId",
                  ""
              )


              if not definition_id:
                  continue


              base_id = definition_id.split(
                  ":",
                  1
              )[0]


              game_unit = units.get(
                  base_id,
                  {}
              )


              if game_unit.get(
                  "combatType"
              ) != 1:

                  continue


              rows.append({
                  "name": base_id,
                  "baseId": base_id,
                  "definitionId": definition_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get(
                          "relic"
                      ) or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })


          fields = [
              "name",
              "baseId",
              "definitionId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]


          with open(
              "roster.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(rows)


          print(
              "Wygenerowano roster.csv"
          )

          print(
              "Liczba postaci:",
              len(rows)
          )

          PY

      # ============================================================
      # GENERATE SHIPS CSV
      # ============================================================

      - name: Generate ships CSV
        run: |
          set -e

          cat > generate_ships.py <<'PY'
          import csv
          import json


          player = json.load(
              open(
                  "swgoh_972824625.json",
                  encoding="utf-8"
              )
          )


          game = json.load(
              open(
                  "data.json",
                  encoding="utf-8"
              )
          )


          localization = json.load(
              open(
                  "localization.json",
                  encoding="utf-8"
              )
          )


          names = localization


          units = {}


          for unit in game.get(
              "units",
              []
          ):

              base_id = unit.get(
                  "baseId"
              )

              if base_id:
                  units[base_id] = unit


          ships = []


          for unit in player.get(
              "rosterUnit",
              []
          ):

              definition_id = unit.get(
                  "definitionId",
                  ""
              )


              if not definition_id:
                  continue


              base_id = definition_id.split(
                  ":",
                  1
              )[0]


              game_unit = units.get(
                  base_id,
                  {}
              )


              if game_unit.get(
                  "combatType"
              ) != 2:

                  continue


              name_key = game_unit.get(
                  "nameKey",
                  ""
              )


              name = names.get(
                  name_key
              )


              if not name:

                  name = names.get(
                      "UNIT_" + base_id + "_NAME"
                  )


              if not name:

                  name = base_id


              ships.append({
                  "name": name,
                  "definitionId": definition_id,
                  "baseId": base_id,
                  "id": unit.get(
                      "id",
                      ""
                  ),
                  "rarity": unit.get(
                      "currentRarity",
                      ""
                  ),
                  "level": unit.get(
                      "currentLevel",
                      ""
                  ),
                  "gearTier": unit.get(
                      "currentTier",
                      ""
                  ),
                  "relicTier": (
                      unit.get(
                          "relic"
                      ) or {}
                  ).get(
                      "currentTier",
                      ""
                  )
              })


          fields = [
              "name",
              "definitionId",
              "baseId",
              "id",
              "rarity",
              "level",
              "gearTier",
              "relicTier"
          ]


          with open(
              "ships.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(ships)


          print(
              "Wygenerowano ships.csv"
          )

          print(
              "Liczba statków:",
              len(ships)
          )


          # --------------------------------------------------------
          # IMPORTANT SHIPS CHECK
          # --------------------------------------------------------

          print("")
          print(
              "Kontrola kluczowych statków:"
          )
          print("")


          important_ships = [
              "SLAVE1",
              "RAZORCREST",
              "IG2000",
              "HOUNDSTOOTH",
              "TIEADVANCED",
              "TIEBOMBERIMPERIAL",
              "TIEFIGHTERIMPERIAL",
              "OUTRIDER",
              "B28EXTINCTIONCLASSBOMBER",
              "MARKVIINTERCEPTOR",
              "TIEDAGGER",
              "EBONHAWK",
              "SCIMITAR"
          ]


          ships_by_base_id = {
              ship["baseId"]: ship
              for ship in ships
          }


          for base_id in important_ships:

              ship = ships_by_base_id.get(
                  base_id
              )


              if ship:

                  print(
                      "OK   |",
                      base_id,
                      "|",
                      ship["name"],
                      "|",
                      ship["rarity"],
                      "★",
                      "|",
                      ship["definitionId"]
                  )

              else:

                  print(
                      "BRAK |",
                      base_id
                  )


          print("")
          print(
              "Statystyka gwiazdek:"
          )


          star_counts = {}


          for ship in ships:

              rarity = ship["rarity"]

              star_counts[rarity] = (
                  star_counts.get(
                      rarity,
                      0
                  ) + 1
              )


          for rarity in sorted(
              star_counts,
              reverse=True
          ):

              print(
                  rarity,
                  "★:",
                  star_counts[rarity]
              )


          print("")


          # --------------------------------------------------------
          # EXECUTOR HARD CHECK
          # --------------------------------------------------------

          executor_ships = [
              "SLAVE1",
              "RAZORCREST",
              "IG2000",
              "HOUNDSTOOTH",
              "TIEADVANCED",
              "TIEBOMBERIMPERIAL",
              "TIEFIGHTERIMPERIAL"
          ]


          missing_executor = [
              base_id
              for base_id in executor_ships
              if base_id not in ships_by_base_id
          ]


          if missing_executor:

              print(
                  "ERROR: Brak statków Executor:"
              )


              for base_id in missing_executor:

                  print(
                      " -",
                      base_id
                  )


              raise SystemExit(
                  1
              )


          print(
              "Kontrola Executor: OK"
          )

          PY

          python generate_ships.py

      # ============================================================
      # SHIP ANALYSIS
      # ============================================================

      - name: Generate ship analysis
        run: |
          set -e

          python ship_analysis.py

          echo "Wygenerowano ship_analysis.md"

      # ============================================================
      # FLEET ANALYSIS
      # ============================================================

      - name: Generate fleet analysis
        run: |
          set -e

          python fleet_analysis.py

          echo "Wygenerowano fleet_analysis.md"

      # ============================================================
      # FARMING RESOURCES
      # ============================================================

      - name: Calculate farming resources
        run: |
          set -e

          python calculate_resources.py

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated files
        run: |
          set -e

          test -s roster.csv
          test -s ships.csv
          test -s account_farming_report.md
          test -s ship_analysis.md
          test -s fleet_analysis.md

          echo ""
          echo "Wygenerowane pliki:"
          echo ""

          ls -lh \
            roster.csv \
            ships.csv \
            account_farming_report.md \
            ship_analysis.md \
            fleet_analysis.md

          echo ""
          echo "Liczba postaci:"
          tail -n +2 roster.csv | wc -l

          echo ""
          echo "Liczba statków:"
          tail -n +2 ships.csv | wc -l

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit generated files
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            roster.csv \
            ships.csv \
            account_farming_report.md \
            ship_analysis.md \
            fleet_analysis.md

          if git diff --cached --quiet; then

            echo "Brak zmian."

          else

            git commit \
              -m "Update SWGOH data"

            git push

          fi

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Stop Comlink
        if: always()
        run: |
          docker rm -f swgoh-comlink 2>/dev/null || true
