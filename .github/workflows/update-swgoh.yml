name: Update SWGOH data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start Comlink
        run: |
          docker pull ghcr.io/swgoh-utils/swgoh-comlink:latest

          docker run -d \
            --name swgoh-comlink \
            --env APP_NAME="Vhonte SWGOH updater" \
            -p 3000:3000 \
            ghcr.io/swgoh-utils/swgoh-comlink:latest

      - name: Test Comlink player endpoint
        run: |
          sleep 10

          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"payload":{"allyCode":972824625}}' \
            http://localhost:3000/player
